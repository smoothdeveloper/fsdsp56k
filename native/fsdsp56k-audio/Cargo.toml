[package]
name = "fsdsp56k-audio"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false
description = "C ABI over cpal and midir: the default output device fed 32-sample blocks through a lock-free ring, and MIDI ports, for the F# tooling's audition"

[lib]
crate-type = ["cdylib"]

# its own workspace: the emulator crate beside it keeps its pinned lock file
[workspace]

[dependencies]
cpal = "=0.18.2"
midir = "=0.11.1"

[profile.release]
opt-level = 3
